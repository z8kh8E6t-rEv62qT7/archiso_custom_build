# Expose incoming phone audio to capture apps instead of playing it to local speakers.
# Keep the default Bluetooth roles and codecs, including A2DP sink and AAC/SBC.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_input.*" }
    ]
    actions = {
      update-props = {
        bluez5.media-source-role = "input"
      }
    }
  }
]
