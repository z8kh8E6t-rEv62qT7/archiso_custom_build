MODULES=(erofs thunderbolt thunderbolt_net nvidia nvidia_modeset nvidia_uvm nvidia_drm)
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
# Recompress modules and firmware together instead of storing their compressed
# files in the early CPIO. Trades higher early-boot RAM usage for a smaller ISO.
MODULES_DECOMPRESS="yes"
